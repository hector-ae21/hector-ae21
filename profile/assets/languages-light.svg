<text x="0" y="99.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#1f2328" text-anchor="start">JavaScript</text>
<rect x="135" y="90" width="323" height="11" rx="5" fill="#e4e8ed"/>

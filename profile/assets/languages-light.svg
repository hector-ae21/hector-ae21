<svg xmlns="http://www.w3.org/2000/svg" width="550" height="320" viewBox="0 0 550 320" role="img">
<rect width="550" height="320" fill="#ffffff"/>
<style>
@keyframes grow{from{transform:scaleX(0)}}
@keyframes rise{from{opacity:0;transform:translateY(9px)}}
@keyframes fade{from{opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
.bar{transform-box:fill-box;transform-origin:left center;animation:grow .9s cubic-bezier(.22,1,.36,1) var(--d,0s) both}
.rise{animation:rise .7s cubic-bezier(.22,1,.36,1) var(--d,0s) both}
.fade{animation:fade .8s ease-out var(--d,0s) both}
.draw{animation:draw 1.7s ease-out .1s both}
@media (prefers-reduced-motion:reduce){
.bar,.rise,.fade,.draw{animation:none;transform:none;opacity:1;stroke-dashoffset:0}
}
</style>
<g transform="translate(0,0)">
<text x="0" y="16" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start">Code by language</text>
<text x="0" y="43.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#1f2328" text-anchor="start">TypeScript</text>
<rect x="135" y="34" width="323" height="11" rx="5" fill="#e4e8ed"/>
<rect class="bar" style="--d:0.00s" x="135" y="34" width="323.0" height="11" rx="5" fill="#0969da"/>
<g class="fade" style="--d:0.00s"><text x="520" y="43.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="end">75.3%</text></g>
